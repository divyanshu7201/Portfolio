<svg 
  width="100%" 
  height="100%" 
  viewBox="0 0 100 100" 
  fill="none" 
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <!-- Metal Chrome Gradient for the main body of D -->
    <linearGradient id="chrome-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="75%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Glow filter for the neon slash -->
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Mask to cut a clean diagonal gap in the D -->
    <mask id="slash-mask">
      {/* Default everything visible */}
      <rect x="0" y="0" width="100" height="100" fill="white" />
      {/* Draw a thick diagonal black line to cut the path */}
      <line 
        x1="12" 
        y1="88" 
        x2="52" 
        y2="48" 
        stroke="black" 
        stroke-width="7" 
        stroke-linecap="round" 
      />
    </mask>
  </defs>

  {/* Black thick background stroke of D for outline contrast on light tabs */}
  <path 
    d="M 25 15 L 60 15 A 35 35 0 0 1 60 85 L 25 85 Z M 45 33 L 55 33 A 17 17 0 0 1 55 67 L 45 67 Z" 
    fill="none"
    stroke="#000000"
    stroke-width="4.5"
    mask="url(#slash-mask)"
    fill-rule="evenodd"
  />

  {/* Main Letter D path with the cut mask applied */}
  <path 
    d="M 25 15 L 60 15 A 35 35 0 0 1 60 85 L 25 85 Z M 45 33 L 55 33 A 17 17 0 0 1 55 67 L 45 67 Z" 
    fill="url(#chrome-grad)"
    mask="url(#slash-mask)"
    fill-rule="evenodd"
  />

  {/* Outer stroke for metal realism */}
  <path 
    d="M 25 15 L 60 15 A 35 35 0 0 1 60 85 L 25 85 Z" 
    stroke="#cbd5e1"
    stroke-width="0.5"
    mask="url(#slash-mask)"
  />

  {/* Inner stroke */}
  <path 
    d="M 45 33 L 55 33 A 17 17 0 0 1 55 67 L 45 67 Z" 
    stroke="#475569"
    stroke-width="0.5"
    mask="url(#slash-mask)"
  />

  {/* Black thick outline for the slash glow */}
  <line 
    x1="10" 
    y1="90" 
    x2="50" 
    y2="50" 
    stroke="#000000" 
    stroke-width="9" 
    stroke-linecap="round" 
  />

  {/* Glowing background electric blue slice (extra thick glow) */}
  <line 
    x1="10" 
    y1="90" 
    x2="50" 
    y2="50" 
    stroke="#0066ff" 
    stroke-width="5" 
    stroke-linecap="round" 
    filter="url(#neon-glow)"
    opacity="0.9"
  />

  {/* Vibrant cyan middle slice layer */}
  <line 
    x1="10" 
    y1="90" 
    x2="50" 
    y2="50" 
    stroke="#00f0ff" 
    stroke-width="2.5" 
    stroke-linecap="round" 
  />
  
  {/* Inner hot white core */}
  <line 
    x1="10" 
    y1="90" 
    x2="50" 
    y2="50" 
    stroke="#ffffff" 
    stroke-width="1.2" 
    stroke-linecap="round" 
  />
</svg>
